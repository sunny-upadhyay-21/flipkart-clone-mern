services:
  mongo:
    image: mongo:7
    container_name: flipcart-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27018:27017"

  backend:
    build:
      context: ./backend
    container_name: flipcart-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/flipcart
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: flipcart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data:
